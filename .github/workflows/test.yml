# 3개 OS에서 자동 테스트를 돌린다 (NFR-COMP-01). 화면 알림·소리는 사람이 확인해야 하므로 MANUAL_CHECKS.md를 따른다.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
