# npm provenance 서명 배포 (NFR-SEC-04, D-75). 태그(v1.0.0 등)를 푸시하면 실행된다.
# 전제: package.json의 repository 필드가 이 GitHub 저장소(공개)를 가리키고, 저장소 시크릿에 NPM_TOKEN이 있어야 한다.
# 태그 푸시와 npm publish는 되돌릴 수 없다(같은 버전 번호는 다시 쓸 수 없다). 사용자가 승인한 뒤에만 태그를 푸시한다.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # provenance 서명에 필요

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 공급망 보안(NFR-SEC-03): 액션은 태그(바뀔 수 있음)가 아니라 커밋 SHA로 고정한다. 올릴 때는 의도해서 SHA를 바꾼다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 태그와 package.json 버전이 같은지 확인
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "태그(${GITHUB_REF_NAME})와 package.json 버전(v${VERSION})이 다릅니다. 배포하지 않습니다."
            exit 1
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
